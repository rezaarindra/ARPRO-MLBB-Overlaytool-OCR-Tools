<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>Technical Pause</title>
    <link rel="stylesheet" href="tournament.css">
    <style>
        .tp { width: 1000px; padding: 0; overflow: hidden; --side: var(--accent); top: var(--y, 190px); transition: opacity .35s ease, transform .35s cubic-bezier(.2, .8, .2, 1); }
        .tp.off { opacity: 0; transform: translate(-50%, -80%) scale(var(--s, 1)); }
        .tp.blue { --side: var(--blue); } .tp.red { --side: var(--red); }
        .pz-main { display: grid; grid-template-columns: 150px 1fr auto; align-items: center; gap: 26px; padding: 22px 32px 18px; border-top: 6px solid var(--side); }
        .pz-logo { width: 150px; height: 150px; object-fit: contain; }
        .pz-logo.none { visibility: hidden; }
        .pz-title { font-size: 30px; letter-spacing: 6px; color: var(--side); display: flex; align-items: center; gap: 12px; }
        .pz-title i { width: 14px; height: 14px; border-radius: 50%; background: var(--side); animation: pzBlink 1.1s infinite; }
        .pz-team { font-size: 70px; line-height: .95; letter-spacing: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 520px; }
        .pz-reason { font-size: 26px; letter-spacing: 3px; color: var(--muted); }
        .pz-time { text-align: right; }
        .pz-time small { display: block; font-size: 20px; letter-spacing: 3px; color: var(--muted); }
        .pz-time b { font-weight: normal; font-size: 104px; line-height: .9; letter-spacing: 3px; font-variant-numeric: tabular-nums; }
        .pz-allow { padding: 0 32px 18px; }
        .pz-allow .row { display: flex; justify-content: space-between; font-size: 24px; letter-spacing: 2px; color: var(--muted); }
        .pz-allow .row b { font-weight: normal; color: #fff; }
        .pz-allow .row b.over { color: var(--red); animation: pzBlink 1s infinite; }
        .pz-allow .bar { height: 10px; }
        .pz-allow .bar i { background: var(--side); transition: width .4s linear; }
        .pz-allow.over .bar i { background: var(--red); }
        .pz-foot { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 12px 32px; background: rgba(255, 255, 255, .05); font-size: 22px; letter-spacing: 2px; }
        .pz-foot .msg { text-align: center; color: var(--gold); letter-spacing: 3px; }
        .pz-foot .t { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pz-foot .t b { font-weight: normal; color: #fff; }
        .pz-foot .t.r { text-align: right; }
        .pz-foot .t.blue b { color: var(--blue); } .pz-foot .t.red b { color: var(--red); }
        @keyframes pzBlink { 50% { opacity: .3; } }
    </style>
</head>
<!-- Technical Pause: tampil sendiri saat pause dimulai di Broadcast Control / Stream Deck, hilang saat game dilanjutkan.
     Opsi URL: ?x= &y= (default 960, 190) &scale= &bg=green|dark &lang=id|en · tes tampilan: ?demo=1 -->
<body>
    <div class="tp off" id="tp">
        <div class="pz-main">
            <img class="pz-logo" id="logo" alt="">
            <div>
                <div class="pz-title"><i></i><span id="title"></span></div>
                <div class="pz-team" id="team" data-noi18n></div>
                <div class="pz-reason" id="reason"></div>
            </div>
            <div class="pz-time"><small id="lblTime"></small><b id="time">0:00</b></div>
        </div>
        <div class="pz-allow" id="allow">
            <div class="row"><span id="lblRemain"></span><b id="remain">-</b></div>
            <div class="bar"><i id="bar"></i></div>
        </div>
        <div class="pz-foot">
            <div class="t blue" id="usedB"></div>
            <div class="msg" id="msg"></div>
            <div class="t red r" id="usedR"></div>
        </div>
    </div>
    <script src="script/tournament-common.js"></script>
    <script src="script/i18n.js"></script>
    <script>
        const tp = document.getElementById('tp'), $ = (id) => document.getElementById(id);
        T.place(tp);
        let st = null, skew = 0;
        const fmt = (s) => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

        function labels() {
            $('lblTime').textContent = I18N.t('PAUSE_TIME');
            $('msg').textContent = I18N.t('RESUME_SOON');
            if (st) render();
        }
        function render() {
            const a = st.active;
            tp.classList.toggle('off', !a);
            if (!a) return;
            const elapsed = (Date.now() + skew - a.startAt) / 1000, team = st.teams[a.side] || { name: '', logo: '' };
            tp.className = `tp ${a.side}`;
            $('title').textContent = I18N.t(a.side === 'admin' ? 'ADMIN_PAUSE' : 'TECHNICAL_PAUSE');
            $('team').textContent = team.name;
            $('reason').textContent = a.reason;
            $('logo').src = team.logo || 'Assets/Other/arpro-logo.png';
            $('time').textContent = fmt(elapsed);
            const isTeam = a.side !== 'admin', left = isTeam ? st.allowance - st.used[a.side] - elapsed : 0;
            $('allow').hidden = !isTeam || !st.allowance;
            if (isTeam) {
                const over = left < 0;
                $('allow').classList.toggle('over', over);
                $('lblRemain').textContent = I18N.t(over ? 'OVER_LIMIT' : 'REMAINING');
                $('remain').textContent = (over ? '+' : '') + fmt(Math.abs(left));
                $('remain').classList.toggle('over', over);
                $('bar').style.width = (st.allowance ? Math.max(0, Math.min(1, left / st.allowance)) * 100 : 0) + '%';
            }
            for (const [id, s] of [['usedB', 'blue'], ['usedR', 'red']]) {
                const used = st.used[s] + (a.side === s ? elapsed : 0);
                $(id).innerHTML = `<b data-noi18n>${T.esc(st.teams[s].name)}</b> · ${fmt(used)} · ${st.count[s]}x`;
            }
        }
        function apply(s) { st = s; skew = s.now - Date.now(); render(); }

        if (T.q.get('demo')) apply({ allowance: 300, now: Date.now(), active: { side: 'blue', reason: 'DEVICE ISSUE', startAt: Date.now() - 47000 }, used: { blue: 95, red: 30 }, count: { blue: 2, red: 1 }, teams: { blue: { name: 'GARUDA MUDA', logo: '/Assets/nationalflag/indonesia.png' }, red: { name: 'NAGA EMAS', logo: '/Assets/nationalflag/malaysia.png' }, admin: { name: 'ADMIN', logo: '' } } });
        else T.live(async () => apply(await T.get('/api/pause')), ['matchdata_update']);
        (function connect() {
            const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);
            ws.onmessage = (ev) => { try { const m = JSON.parse(ev.data); if (m.type === 'pause_update' && !T.q.get('demo')) apply(m.data); } catch (e) {} };
            ws.onclose = () => setTimeout(connect, 2000);
        })();
        setInterval(() => { if (st && st.active) render(); }, 250);
        labels();
        I18N.onChange(labels);
    </script>
</body>
</html>
