<script>
// timer ≤ 10 detik berdenyut merah · teks fase berganti = animasi pop
// teks fase kosong (displayheroban6.js) → diambil dari nama gif arah: LeftBanning / RightPicking / Adjustment
(function () {
    const t = document.getElementById('timer'), p = document.getElementById('phase'), arrow = document.getElementById('arrow');
    new MutationObserver(() => t.parentElement.classList.toggle('low', (parseInt(t.textContent, 10) || 0) <= 10)).observe(t, { childList: true, characterData: true, subtree: true });
    let last = '';
    const root = document.getElementById('dsRoot');
    const fill = () => {
        const src = arrow.getAttribute('src') || '';
        const m = !p.textContent.trim() && /(banning|picking|adjustment)/i.exec(src);
        if (m) p.textContent = m[1].toUpperCase();
        // panah giliran mengikuti gif arah yang sama dengan template lama (LeftPicking / RightBanning / Adjustment)
        root.dataset.turn = /\/left/i.test(src) ? 'left' : /\/right/i.test(src) ? 'right' : '';
    };
    // pratinjau di browser yang lebih sempit dari 1920 px: diperkecil agar terlihat utuh (OBS / vMix 1920 tidak berubah)
    const fit = () => { const k = Math.min(1, innerWidth / 1920); root.style.transform = k < 1 ? `scale(${k})` : ''; };
    addEventListener('resize', fit); fit();
    new MutationObserver(fill).observe(arrow, { attributes: true, attributeFilter: ['src'] });
    new MutationObserver(() => {
        fill();
        if (p.textContent === last) return;
        last = p.textContent;
        p.classList.remove('pop'); void p.offsetWidth; p.classList.add('pop');
    }).observe(p, { childList: true, characterData: true, subtree: true });
})();
</script>
